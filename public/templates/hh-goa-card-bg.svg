<svg width="750" height="1000" viewBox="0 0 750 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- deep green + technical grid + tropical Goa palette -->
    <linearGradient id="bgTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d4428"/>
      <stop offset="1" stop-color="#072618"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff7b54" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a3" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12919e"/>
      <stop offset="1" stop-color="#0b5f7e"/>
    </linearGradient>
  </defs>

  <!-- base body -->
  <rect x="0" y="0" width="750" height="1000" fill="url(#bgTop)"/>
  <rect x="0" y="0" width="750" height="60" fill="#0a2e1c"/>

  <!-- technical grid -->
  <g stroke="#1d5c37" stroke-width="1" opacity="0.18">
    <g>
      <line x1="62.5" y1="0" x2="62.5" y2="1000"/>
      <line x1="125" y1="0" x2="125" y2="1000"/>
      <line x1="187.5" y1="0" x2="187.5" y2="1000"/>
      <line x1="250" y1="0" x2="250" y2="1000"/>
      <line x1="312.5" y1="0" x2="312.5" y2="1000"/>
      <line x1="375" y1="0" x2="375" y2="1000"/>
      <line x1="437.5" y1="0" x2="437.5" y2="1000"/>
      <line x1="500" y1="0" x2="500" y2="1000"/>
      <line x1="562.5" y1="0" x2="562.5" y2="1000"/>
      <line x1="625" y1="0" x2="625" y2="1000"/>
      <line x1="687.5" y1="0" x2="687.5" y2="1000"/>
    </g>
    <g>
      <line x1="0" y1="83.33" x2="750" y2="83.33"/>
      <line x1="0" y1="166.67" x2="750" y2="166.67"/>
      <line x1="0" y1="250" x2="750" y2="250"/>
      <line x1="0" y1="333.33" x2="750" y2="333.33"/>
      <line x1="0" y1="416.67" x2="750" y2="416.67"/>
      <line x1="0" y1="500" x2="750" y2="500"/>
      <line x1="0" y1="583.33" x2="750" y2="583.33"/>
      <line x1="0" y1="666.67" x2="750" y2="666.67"/>
      <line x1="0" y1="750" x2="750" y2="750"/>
      <line x1="0" y1="833.33" x2="750" y2="833.33"/>
      <line x1="0" y1="916.67" x2="750" y2="916.67"/>
    </g>
  </g>

  <!-- faint sun disc top-right -->
  <circle cx="640" cy="96" r="230" fill="url(#sunGlow)" opacity="0.5"/>
  <circle cx="640" cy="96" r="120" fill="url(#halo)" opacity="0.55"/>
  <circle cx="640" cy="96" r="26" fill="#ffcf5e" opacity="0.55"/>
  <!-- pink sun-ring -->
  <circle cx="640" cy="96" r="40" fill="none" stroke="#e8407c" stroke-width="2" opacity="0.4"/>

  <!-- birds -->
  <g fill="none" stroke="#09291a" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <path d="M118 84 q7 -6 14 0 q7 -6 14 0"/>
    <path d="M156 58 q6 -5 12 0 q6 -5 12 0"/>
  </g>

  <!-- thin ocean band at the base -->
  <rect x="0" y="938" width="750" height="62" fill="url(#ocean)"/>
  <g fill="none" stroke="#bde9ee" stroke-width="2" opacity="0.3">
    <path d="M0 948 q45 -12 90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0"/>
    <path d="M0 970 q45 -12 90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0"/>
  </g>
  <!-- sun reflection -->
  <rect x="596" y="938" width="44" height="62" fill="#ffdf8a" opacity="0.18"/>

  <!-- tiny palms at the base corners -->
  <g>
    <path d="M8 1000 Q18 952 12 916 Q8 892 12 868" fill="none" stroke="#0a3a22" stroke-width="6" stroke-linecap="round"/>
    <path d="M12 868 Q-8 852 -16 862 Q16 878 22 884 Q40 864 56 852 Q38 878 30 884 Z" fill="#071f13"/>
  </g>
  <g>
    <path d="M742 1000 Q732 952 738 916 Q742 892 738 868" fill="none" stroke="#0a3a22" stroke-width="6" stroke-linecap="round"/>
    <path d="M738 868 Q758 852 766 862 Q734 878 728 884 Q710 864 694 852 Q712 878 720 884 Z" fill="#071f13"/>
  </g>

  <!-- gold frame: hairline credential frame -->
  <rect x="28" y="88" width="694" height="884" fill="none" stroke="#d9b25f" stroke-width="3"/>
  <rect x="36" y="96" width="678" height="868" fill="none" stroke="#f0cf83" stroke-width="1" opacity="0.6"/>
  <g fill="#f0cf83">
    <rect x="28" y="88" width="34" height="4"/>
    <rect x="28" y="88" width="4" height="34"/>
    <rect x="688" y="88" width="34" height="4"/>
    <rect x="718" y="88" width="4" height="34"/>
    <rect x="28" y="968" width="34" height="4"/>
    <rect x="28" y="938" width="4" height="34"/>
    <rect x="688" y="968" width="34" height="4"/>
    <rect x="718" y="938" width="4" height="34"/>
  </g>

  <!-- baked branding: HACKER HOUSE // GOA -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="56" y="74" font-size="20" font-weight="700" letter-spacing="4" fill="#ffe08a">HACKER HOUSE</text>
    <text x="286" y="74" font-size="20" font-weight="700" letter-spacing="3" fill="#e8407c">// GOA</text>
    <path d="M56 86 h344" stroke="#e8407c" stroke-width="2"/>
    <text x="638" y="74" font-size="11" font-weight="500" letter-spacing="3" fill="#9db8a4">EST 2026 · GOA</text>
  </g>
</svg>