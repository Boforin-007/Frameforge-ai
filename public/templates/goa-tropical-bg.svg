  <rect x="28" y="28" width="844" height="1294" fill="none" stroke="#f0cf83" stroke-width="2" opacity="0.8"/>
  <g fill="#f0cf83">
    <rect x="18" y="18" width="86" height="6"/>
    <rect x="18" y="18" width="6" height="86"/>
    <rect x="796" y="18" width="86" height="6"/>
    <rect x="876" y="18" width="6" height="86"/>
    <rect x="18" y="1326" width="86" height="6"/>
    <rect x="18" y="1258" width="6" height="86"/>
    <rect x="796" y="1326" width="86" height="6"/>
    <rect x="876" y="1258" width="6" height="86"/>
  </g>
  <g fill="#d9b25f" opacity="0.55">
    <circle cx="64" cy="64" r="3"/>
    <circle cx="836" cy="64" r="3"/>
    <circle cx="64" cy="1286" r="3"/>
    <circle cx="836" cy="1286" r="3"/>
  </g>
