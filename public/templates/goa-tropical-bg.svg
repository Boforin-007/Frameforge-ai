<svg width="900" height="1350" viewBox="0 0 900 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- base deep-green + technical grid colours -->
    <linearGradient id="bgTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d4428"/>
      <stop offset="1" stop-color="#072618"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ff9e5e" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff7b54" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12919e"/>
      <stop offset="1" stop-color="#0b5f7e"/>
    </linearGradient>
    <linearGradient id="beach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c27a"/>
      <stop offset="1" stop-color="#c9925a"/>
    </linearGradient>
    <linearGradient id="palmTrunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a3a22"/>
      <stop offset="1" stop-color="#071f13"/>
    </linearGradient>
    <radialGradient id="lanternGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

