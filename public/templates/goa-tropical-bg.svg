  <g>
    <path d="M56 1350 Q70 1080 40 830 Q24 700 34 560" fill="none" stroke="url(#palmTrunk)" stroke-width="18" stroke-linecap="round"/>
    <path d="M34 560 Q-30 470 -70 500 Q14 520 40 570 Q66 508 148 470 Q70 560 46 588 Z" fill="#071f13"/>
    <path d="M36 572 Q-46 588 -96 620 Q2 624 44 594 Z" fill="#0a3a22"/>
    <path d="M42 566 Q60 470 120 402 Q86 520 66 580 Z" fill="#071f13"/>
