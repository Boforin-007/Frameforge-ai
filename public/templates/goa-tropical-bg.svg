  </g>

  <!-- sunset -->
  <circle cx="450" cy="540" r="430" fill="url(#sunGlow)"/>
  <circle cx="450" cy="540" r="196" fill="#ffcf5e" opacity="0.9"/>
  <circle cx="450" cy="540" r="150" fill="#ffe08a" opacity="0.95"/>

