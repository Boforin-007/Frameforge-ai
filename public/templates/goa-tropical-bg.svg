  <!-- coral + shells + starfish on the beach -->
  <g>
    <path d="M120 1300 q10 -46 40 -46 q12 14 -4 30 q18 2 14 22 Z" fill="#e8407c"/>
    <path d="M178 1312 q6 -26 24 -26 q8 8 -2 16 q10 2 8 12 Z" fill="#ff9e5e"/>
    <path d="M680 1306 q10 -56 46 -56 q14 18 -6 34 q22 4 14 26 Z" fill="#c94d8f"/>
    <path d="M740 1286 q4 -22 18 -22 q6 8 -2 14 q8 2 6 10 Z" fill="#ff9e5e"/>
    <g fill="#ffd98a" stroke="#c98a3f" stroke-width="2">
      <path d="M300 1300 l0 -26 l-12 8 l10 -22 l4 22 l16 -12 l-4 20 Z"/>
      <path d="M588 1304 l-3 -22 l-14 2 l14 -18 l4 18 l16 -2 l-12 14 Z"/>
