      <line x1="60" y1="0" x2="60" y2="1350"/>
      <line x1="120" y1="0" x2="120" y2="1350"/>
      <line x1="180" y1="0" x2="180" y2="1350"/>
      <line x1="240" y1="0" x2="240" y2="1350"/>
      <line x1="300" y1="0" x2="300" y2="1350"/>
      <line x1="360" y1="0" x2="360" y2="1350"/>
      <line x1="420" y1="0" x2="420" y2="1350"/>
      <line x1="480" y1="0" x2="480" y2="1350"/>
      <line x1="540" y1="0" x2="540" y2="1350"/>
      <line x1="600" y1="0" x2="600" y2="1350"/>
      <line x1="660" y1="0" x2="660" y2="1350"/>
      <line x1="720" y1="0" x2="720" y2="1350"/>
      <line x1="780" y1="0" x2="780" y2="1350"/>
      <line x1="840" y1="0" x2="840" y2="1350"/>
    </g>
    <g>
      <line x1="0" y1="60" x2="900" y2="60"/>
      <line x1="0" y1="120" x2="900" y2="120"/>
      <line x1="0" y1="180" x2="900" y2="180"/>
      <line x1="0" y1="240" x2="900" y2="240"/>
      <line x1="0" y1="300" x2="900" y2="300"/>
      <line x1="0" y1="360" x2="900" y2="360"/>
      <line x1="0" y1="420" x2="900" y2="420"/>
      <line x1="0" y1="480" x2="900" y2="480"/>
      <line x1="0" y1="560" x2="900" y2="560"/>
      <line x1="0" y1="640" x2="900" y2="640"/>
      <line x1="0" y1="720" x2="900" y2="720"/>
      <line x1="0" y1="820" x2="900" y2="820"/>
      <line x1="0" y1="920" x2="900" y2="920"/>
      <line x1="0" y1="1020" x2="900" y2="1020"/>
      <line x1="0" y1="1120" x2="900" y2="1120"/>
      <line x1="0" y1="1220" x2="900" y2="1220"/>
