    <path d="M0 1096 q45 -14 90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0"/>
    <path d="M0 1152 q45 -14 90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0"/>
    <path d="M0 1216 q45 -14 90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0"/>
  </g>
  <!-- sun reflection on water -->
  <rect x="412" y="1000" width="76" height="250" fill="#ffdf8a" opacity="0.22"/>
  <rect x="428" y="1000" width="44" height="250" fill="#ffeaa6" opacity="0.18"/>

  <!-- beach -->
  <path d="M0 1300 Q450 1258 900 1300 L900 1350 L0 1350 Z" fill="url(#beach)"/>

